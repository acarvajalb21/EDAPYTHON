title: "EDA: acceso a atención formal en salud en el Atlántico"
author: "Alejandro Carvajal y Mateo Chang"
copyright: "2026"

execute:
  execute_notebooks: "off"

only_build_toc_files: true

exclude_patterns:
  - _build
  - .jupyter_cache
  - "**.ipynb_checkpoints"
  - datos
  - salidas

repository:
  url: https://github.com/acarvajalb21/EDAPYTHON
  branch: main
  path_to_book: ""

html:
  use_repository_button: true
  use_issues_button: false
  home_page_in_navbar: true

parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
